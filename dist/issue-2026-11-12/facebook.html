Luzon spot power prices jump 51% in October

💵 PISO NGAYON
$1 = ₱63.25 (up ₱0.35 from the previous day; up ₱0.48 in about a month)
$500 sent home = about ₱31,626 at the reference rate, before fees.
(Reference rate, 2026-11-11. Remittance rates and fees differ.)

▪️ BALITA: Luzon spot power prices jump 51%
Electricity bought on the spot market got much pricier in October. The spot market, called WESM, is where power firms buy extra electricity when their long-term supply contracts fall short. In Luzon, the average spot price rose 51.2% to P7.83 per kilowatt-hour (kWh), the unit used on your bill, according to the Independent Electricity Market Operator of the Philippines (IEMOP). Across the whole grid, the average climbed 18.4% to P8.79 per kWh. IEMOP&#39;s Rica Cagnayo said tighter supply margins were the cause: demand rose while planned and forced plant outages cut the power available. The Visayas and Mindanao went the other way, down 9.9% to P11.19 and down 12.3% to P11.06 per kWh, on better supply. Why it matters: when distributors buy more from the spot market, the cost can reach household bills, and the coverage says Luzon homes and businesses may pay more this month. Still unknown: how much your own distributor will add. BusinessWorld: Spot prices surge to nearly P9/kWh in October (https://bworldonline.com/economy/2026/11/11/793274/spot-prices-surge-to-nearly-p9-kwh-in-october/)
• Inquirer Business also reported the jump: Luzon spot power rates surged 51% (https://business.inquirer.net/620420/luzon-spot-power-rates-surged-51)
• Inquirer Business: Luzon faces higher power rates in November (https://business.inquirer.net/620343/luzon-faces-higher-power-rates-in-november). We have only the headline, so the size of any increase is not confirmed in our material.
👉 Para sa pamilya: Luzon families: set aside a little more for the November power bill and compare it with October&#39;s once it arrives.

▪️ BALITA: LPG rollback possible this month
Families who cook with LPG may see lower prices soon. Saudi Aramco&#39;s contract price, the global benchmark that local LPG prices follow, has dropped by $90 per metric ton, Regasco president Arnel Ty said, linking the drop to the result of last week&#39;s US midterm elections. If that trend holds until the end of November, LPG could fall by P5 to P6 per kilo in December. Ty said a rollback, meaning a price cut, might even come earlier this month, depending on Thursday&#39;s meeting between LPG players and the Department of Energy (DOE). He said any early cut should be counted against December&#39;s contract price. Cooking gas has been costlier since the Middle East war broke out in late February, and Ty said LPG demand is down as much as 30 percent this year. Still unknown: whether any brand will actually cut early, and by how much. PhilStar: LPG price rollback possible this month (https://www.philstar.com/headlines/2026/11/12/2569520/lpg-price-rollback-possible-month)
👉 Para sa pamilya: Buying LPG this month? Compare the tank price with last month&#39;s; a P5 to P6 per kilo cut is possible but not yet confirmed.

▪️ BALITA: Forecasters cut 2026 growth outlook
Two research firms now expect the economy to grow less than the government hoped this year. Nomura cut its 2026 growth forecast to three percent from 3.8 percent, and BMI, a unit of Fitch Solutions, cut its forecast to 2.6 percent from three percent. Both are below the government&#39;s 3.5 to 4.5 percent target. Growth here means GDP, the total value of goods and services the country produces. It grew just 2.1 percent in the third quarter, the weakest since early 2021. Why it matters at home: inflation reached 7.8 percent in October, household spending growth slowed to 2.4 percent, and farm output shrank 4.8 percent in the third quarter, which can weigh on rural incomes. BMI also cut its 2027 forecast to four percent and expects weak momentum to carry over. Nomura is more hopeful, seeing fourth-quarter growth above four percent as government spending picks up. Still unknown: how fast inflation eases and infrastructure spending recovers. PhilStar Business: Philippines growth outlook dims as Nomura, BMI cut forecasts (https://www.philstar.com/business/2026/11/12/2569453/philippines-growth-outlook-dims-nomura-bmi-cut-forecasts)
• Inquirer Business: Weak growth momentum to spill into 2027–BMI (https://business.inquirer.net/620416/weak-growth-momentum-to-spill-into-2027-bmi)
👉 Para sa pamilya: With inflation at 7.8 percent, the same padala covers less at home; it is a good week to review the monthly family budget.

▪️ DISKARTE: Check the pump price against the rollback
This week&#39;s fuel rollback was big: gasoline fell by as much as P17 per liter and diesel by P4, per PhilStar: LPG price rollback possible this month (https://www.philstar.com/headlines/2026/11/12/2569520/lpg-price-rollback-possible-month). But 1-Rider Party-list Rep. Rodge Gutierrez urged the DOE and oil firms to fully apply the cut, after reports of incomplete compliance at some stations. We have only the summary, so which stations, and how many, is not confirmed. Before filling up, compare the posted price with what you paid last week. Inquirer: DOE, oil firms urged to fully implement fuel price rollback (https://newsinfo.inquirer.net/2339946/doe-oil-firms-urged-to-fully-implement-fuel-price-rollback)
👉 Para sa pamilya: Before filling up, compare the posted pump price with last week&#39;s; the rollback should be visible at the pump.

▪️ IBA PANG BALITA
• NCR tax deadline: The BIR moved to Nov. 19 the deadline for tax returns and payments originally due Nov. 16 to 18, for covered revenue district offices and large taxpayer divisions in Metro Manila, because of the ASEAN Summit. Inquirer: BIR extends NCR tax filing deadline due to Asean Summit (https://newsinfo.inquirer.net/2339819/bir-extends-ncr-tax-filing-deadline-due-to-asean-summit)
• BIR data breach: The BIR said taxpayer profile data may have been exposed in a recent cyber breach and is still investigating; it says its internal database systems remain intact. Inquirer Business: BIR admits exposure of taxpayer profile data in recent cyber breach (https://business.inquirer.net/620438/bir-admits-exposure-of-taxpayer-profile-data-in-recent-cyber-breach)
• El Niño farm losses: El Niño damage to agriculture has reached nearly P10 billion and affected more than 324,000 farmers, while food inflation stood at 6.4 percent in October. Inquirer Business: Why Philippine agriculture matters, even when budgets are tight (https://business.inquirer.net/620407/why-philippine-agriculture-matters-even-when-budgets-are-tight)
• Pork import ban: Industry groups in Brazil and the Philippines are asking the government to reconsider the DA&#39;s two-month suspension of pork imports, warning it could affect retail prices and local businesses. Inquirer Business: Brazil traders oppose PH suspension of pork imports (https://business.inquirer.net/620410/brazil-traders-oppose-ph-suspension-of-pork-imports)
