Peso relief may hinge on cheaper oil

💵 PISO NGAYON
$1 = ₱62.90 (down ₱0.27 from the previous day; up ₱0.15 in about a month)
$500 sent home = about ₱31,452 at the reference rate, before fees.
(Reference rate, 2026-11-10. Remittance rates and fees differ.)

▪️ BALITA: Peso relief may hinge on cheaper oil
The peso may get some short-term relief from cheaper oil and the usual rush of Christmas padala. But two big banks say a lasting recovery is unlikely unless crude prices fall further, reports PhilStar Business: ‘Peso recovery hinges on lower oil prices’ (https://www.philstar.com/business/2026/11/11/2569251/peso-recovery-hinges-lower-oil-prices). Bank of America strategist Abhay Gupta says the peso could steady near current levels, with remittances expected to help most in November and early December. For a real turnaround, he says Brent crude, the global oil benchmark, would need to fall to around $70 per barrel, and the country&#39;s external deficit would need to narrow. Citi&#39;s Johanna Chua expects the peso to reach around 64 per dollar by March 2027. She put it simply: &quot;Peso is very sensitive to oil.&quot; For context, the peso hit a record low of 64.17 to $1 on Oct. 27 before rallying back to the 62 level. Why it matters: a weak peso stretches each dollar sent home, but it also makes imported fuel and goods pricier. Still unknown: where oil prices go next.
👉 Para sa pamilya: A weak peso stretches each dollar of padala, but fuel-linked prices at home can eat into that gain, so budget for both.

▪️ BALITA: More BSP rate hikes expected
Economists expect the Bangko Sentral ng Pilipinas to keep raising its policy rate, the benchmark that guides what banks charge for loans, reports PhilStar Business: Economists see more BSP rate hikes (https://www.philstar.com/business/2026/11/11/2569250/economists-see-more-bsp-rate-hikes). This is despite the economy growing just 2.1 percent in the third quarter, its slowest pace since the pandemic. The reason is stubborn inflation. HSBC&#39;s Aris Dacanay expects a 25-basis-point increase (a basis point is one hundredth of a percentage point) to 5.75 percent in December, which he thinks would end the hikes. Bank of America sees another 25-basis-point move in December and one more in February 2027, bringing the rate to six percent. BPI&#39;s Emilio Neri Jr. warns that pausing too early could let inflation settle in. The squeeze on families is already visible. Household spending grew only 2.4 percent, and HSBC notes that much of the rise in spending reflected higher prices, not more goods bought. BofA sees inflation easing to 5.2 percent next year from six percent in 2026. Still unknown: what the BSP will actually decide in December.
• Inquirer Business reports the same expectation: BSP seen extending rate hikes to curb inflation (https://business.inquirer.net/620301/bsp-seen-extending-rate-hikes-to-curb-inflation). We have only the headline of that report.
👉 Para sa pamilya: Loans with adjustable rates, like some housing and car loans, may cost more into 2027, so check your repricing date with your bank.

▪️ BALITA: ERC proposes gas power price caps
The Energy Regulatory Commission has proposed price ceilings for the country&#39;s first auction of mid-merit natural gas power, reports PhilStar Business: ERC proposes gas auction price cap at P7/kWh (https://www.philstar.com/business/2026/11/11/2569249/erc-proposes-gas-auction-price-cap-p7kwh). Mid-merit plants can quickly raise or lower their output, which keeps the grid steady between always-on plants and peak-hour sources. The proposed cap is P7.16 per kWh for new combined-cycle gas plants, P4.45 for new open-cycle plants and P6.79 for new gas engines. Existing combined-cycle plants in Luzon would face lower caps of P2.76 and P2.66 per kWh. The Department of Energy runs the auction and is seeking 3,800 MW. The caps cover only the cost of building and running the plants. Fuel costs, including the price of gas, are excluded. Those would be recovered from consumers monthly, based on actual costs and checked against an ERC benchmark. ERC chairman Francis Saturnino Juan said plants should be &quot;paid only for power they actually deliver.&quot; This is still a proposal. Still unknown: how much it will add to household bills, and when.
👉 Para sa pamilya: No change to your electric bill yet, since this is a proposal, but gas fuel costs from these plants would later be passed on monthly.

▪️ DISKARTE: GSIS emergency loans in calamity areas
This may help if someone in the family works in government or receives a GSIS pension. The Government Service Insurance System has opened another batch of emergency loans worth P2.75 billion, reports Inquirer Business: GSIS readies P2.75B for calamity-hit members (https://business.inquirer.net/620256/gsis-readies-p2-75b-for-calamity-hit-members). The loans are for members in areas hit by El Niño, crop pests and a dengue outbreak. The allotment covers 109,047 active members, plus old-age and disability pensioners. Our material has only the report&#39;s summary. That means the covered areas, loan amounts and deadline are not confirmed here, so check directly with GSIS before applying.
👉 Para sa pamilya: If a relative is a government worker or GSIS pensioner in an affected area, ask GSIS this week whether they qualify and what the terms are.

▪️ SABI NILA
• PhilStar Opinion (columnist not named in our copy): The column argues that President Marcos&#39;s calls for calm about the peso and national debt fall short as growth slows, and writes: &quot;Once among Asia’s fastest-growing economies, the Philippines is now the laggard.&quot; BBM’s dismissive assurances amid a deteriorating economy (https://www.philstar.com/opinion/2026/11/11/2569256/bbms-dismissive-assurances-amid-deteriorating-economy)
• PhilStar Opinion (columnist not named in our copy): The column suggests that unsold condominium units in Metro Manila could be used to ease crowding in hospitals, where public wards now often hold six to even eight patients per room. Condospital or hospitel? (https://www.philstar.com/opinion/2026/11/11/2569257/condospital-or-hospitel)

▪️ IBA PANG BALITA
• Fake lending app: The SEC issued a cease-and-desist order against Peso Flow&#39;s website and platform. The SEC says the platform posed as Sofi Financing Inc., a registered financing firm. No response from Peso Flow appears in the coverage. Inquirer Business: SEC stops operations of Peso Flow (https://business.inquirer.net/620263/sec-stops-operations-of-peso-flow)
• Targets under review: Malacañang says the Development Budget Coordination Committee will review the growth, inflation and peso targets for 2026 and 2027 in early December, after third-quarter growth came in at 2.1%. The current full-year growth target is 3.5% to 4.5%. BusinessWorld: 2026, 2027 economic targets face review, Palace says (https://bworldonline.com/economy/2026/11/10/792940/2026-2027-economic-targets-face-review-palace-says/)
• Bond yields outlook: Manulife Investments Philippines says government bond yields, the interest the government pays when it borrows, may start easing only over the next six to 12 months, as inflation peaks. Inquirer Business: Bond yields to ease over next year—Manulife (https://business.inquirer.net/620153/bond-yields-to-ease-over-next-year-manulife)
• Stocks bounce back: The PSEi rose 0.67 percent to 5,716.15, recovering part of Monday&#39;s drop on Wall Street gains and lower global oil prices. PhilStar Business: Stocks rise on Wall Street cues, oil price drop (https://www.philstar.com/business/2026/11/11/2569248/stocks-rise-wall-street-cues-oil-price-drop)

▪️ NOONG ARAW
• 2020: Typhoon Vamco, known here as Ulysses, made its first landfall in Quezon near midnight on November 11. It brought the worst flooding in Metro Manila since Ketsana in 2009 and killed 67 people. The floods in Cagayan and Isabela, after Magat Dam opened all seven of its gates, remain a reminder to follow dam advisories during typhoon season. Wikipedia: Typhoon Vamco (https://en.wikipedia.org/wiki/Typhoon_Vamco)
