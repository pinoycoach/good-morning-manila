▪️ BALITA: Filipino seafarer dies in Gulf tanker blast
A Filipino seafarer has died after an explosion on the MT Velos Sapphire, a Marshall Islands-flagged tanker carrying oil products, in the Persian Gulf in the early hours of November 5. The Department of Migrant Workers (DMW) confirmed it in a statement on Saturday. The ship was on its way to Sitrah, Bahrain. The 21 other Filipino crew members on board are safe and unharmed. Initial reports point to a possible drone attack, but the DMW said the exact cause has not been verified. No oil spill or environmental damage has been reported. The manning agency, the licensed company that deployed the crew, told the family after the shipowner confirmed the death, and the shipowner has pledged full support. The seafarer&#39;s name does not appear in the coverage. Migrant Workers Secretary Hans Leo Cacdac said: &quot;We will provide all the support and guidance the bereaved family needs during this difficult time.&quot; Still unknown is what caused the blast. The DMW says it is working with the shipowner and international authorities to find out. PhilStar: One Pinoy dead in Persian Gulf tanker explosion (https://www.philstar.com/headlines/2026/11/08/2568735/one-pinoy-dead-persian-gulf-tanker-explosion)
• Inquirer Global Nation also reports the death, citing the DMW: DMW: Filipino seafarer killed in drone attack on Persian Gulf tanker (https://globalnation.inquirer.net/346271/dmw-filipino-seafarer-killed-in-drone-attack-on-persian-gulf-tanker). We have only the headline. In its statement, the DMW said the cause is still unverified.
👉 Para sa pamilya: If a family member works on a ship in the Gulf, their licensed manning agency is the first place to ask for crew updates.

▪️ BALITA: Power regulator drafts cap on reserve prices
The Energy Regulatory Commission (ERC) wants a ceiling on what power reserves can cost before that market reopens. Power reserves, also called ancillary services, are backup supply the grid operator buys to keep electricity steady when supply and demand do not match. The ERC suspended the reserve market on Oct. 14 after prices stayed high. Its review found that reserves bought from that market added an estimated P1.29 per kilowatt-hour to Visayas power rates. Reserves bought under contracts with the National Grid Corp. of the Philippines added only P0.02. Under the draft rules, a &quot;secondary price cap&quot; would kick in once the three-day average price passes a set level. It would apply separately in Luzon, the Visayas and Mindanao. ERC Chairman Francis Saturnino C. Juan said: &quot;We are putting this safeguard on the table now so that it is ready before the reserve market resumes.&quot; The ERC tested the cap on prices from Aug. 26 to Sept. 25, 2026. It says the cap could have cut average reserve prices by 12% to 50% in the Visayas. Still unknown are the date the market resumes and the final rules. BusinessWorld: ERC considering power-reserve trading price cap (https://bworldonline.com/economy/2026/11/08/792135/erc-considering-power-reserve-trading-price-cap/)
👉 Para sa pamilya: No change to the electric bill yet. These are draft rules, and the reserve market behind higher Visayas rates is still suspended.

▪️ BALITA: Updated Taiwan pact may open more jobs
The Philippines and Taiwan have signed an updated Memorandum of Understanding (MOU), a formal agreement on how Filipino workers are hired. The Department of Migrant Workers (DMW) expects it to open more jobs for qualified Filipinos, especially in hospitality: hotels, restaurants and similar services. The DMW welcomed the signing in a statement on Saturday. That is as far as we can confirm, because we have only the headline and summary of the report, not the full article. Still unknown are how many jobs there will be, which positions, what pay and requirements apply, and when hiring under the updated agreement begins. Until the DMW publishes details, treat any job offer that cites this pact with care. Inquirer Global Nation: Updated pact expected to open more Taiwan jobs for OFWs (https://globalnation.inquirer.net/346297/updated-pact-expected-to-open-more-taiwan-jobs-for-ofws)
👉 Para sa pamilya: If someone offers a Taiwan hospitality job, check that the agency is DMW-licensed before paying any fee or handing over documents.

▪️ DISKARTE: Storm &#39;Samuel&#39; to stay far offshore
This is a heads-up more than a to-do. As of 10 a.m. Sunday, Severe Tropical Storm Cempaka was 1,720 kilometers east of Extreme Northern Luzon. PAGASA expects it to enter the Philippine area of responsibility (PAR), the zone PAGASA monitors, between Sunday evening and early Monday. Inside the PAR it will be called &quot;Samuel.&quot; It should turn away and exit by Monday afternoon or evening, and PAGASA says it will not directly affect the country. The thing to watch is amihan, the northeast monsoon. It brings very rough seas off Northern Luzon from Tuesday, and a Gale Warning is likely Monday. PhilStar: &#39;Cempaka&#39; expected to intensify into typhoon before entering PAR (https://www.philstar.com/weather/2026/11/08/2568769/cempaka-expected-intensify-typhoon-entering-par)
• Inquirer reports the storm has since strengthened: Cempaka intensifies into typhoon outside PAR (https://newsinfo.inquirer.net/2338055/cempaka-intensifies-into-typhoon-outside-par). We have only the headline.
👉 Para sa pamilya: If family in Northern Luzon plans a boat trip from Tuesday, check PAGASA for a Gale Warning before leaving.

▪️ SABI NILA
• PhilStar Opinion immigration column: The column writes that the Board of Immigration Appeals recently ruled that leaving the US on advance parole, a permit to travel abroad and return, could trigger a 3- or 10-year bar on coming back. It argues that DACA recipients and people with pending adjustment of status applications should stay put: &quot;do not travel outside the US. Or first consult with an immigration attorney before doing so.&quot; PhilStar Opinion: Don’t travel on advance parole! (https://www.philstar.com/opinion/2026/11/08/2568570/dont-travel-advance-parole)
• Editorial, PhilStar Opinion: The editorial argues that the country still faces an acute shortage of health professionals, citing CHED&#39;s estimate of a shortage of up to 190,000 nurses as of 2025: &quot;The exodus of nurses for better paying jobs abroad has been a problem in the country for decades.&quot; PhilStar Opinion: EDITORIAL — A continuing shortage (https://www.philstar.com/opinion/2026/11/08/2568575/editorial-continuing-shortage)

▪️ IBA PANG BALITA
• Strait of Hormuz: Iran&#39;s Revolutionary Guards said three oil tankers caught fire on Sunday in the Strait of Hormuz, where Tehran has restricted ship traffic since the Iran war began in late February. We have only the summary of this report. Inquirer Global Nation: Iran says 3 tankers caught fire in Strait of Hormuz (https://globalnation.inquirer.net/346316/iran-says-3-tankers-caught-fire-in-strait-of-hormuz)
• Who issues visas: The Department of Foreign Affairs said on Sunday it has legal authority to issue Philippine visas. It again rejected Ombudsman Jesus Crispin Remulla&#39;s claim that this power belongs only to immigration authorities under the Department of Justice. Inquirer Global Nation: DFA hits back at Ombudsman, defends authority to issue PH visas (https://globalnation.inquirer.net/346301/dfa-hits-back-at-ombudsman-defends-authority-to-issue-ph-visas)
• Jobs in Luxembourg: The DMW said the Philippines and Luxembourg are exploring a labor cooperation agreement, a Joint Declaration of Intent, that could open more jobs for skilled Filipino workers there. It is still at the exploring stage. Inquirer Global Nation: DMW: PH, Luxembourg eye labor pact to open more jobs for Filipinos (https://globalnation.inquirer.net/346278/dmw-ph-luxembourg-eye-labor-pact-to-open-more-jobs-for-filipinos)

▪️ NOONG ARAW
• 2013: Typhoon Haiyan, one of the strongest tropical cyclones ever recorded, struck the Visayas on this day. It left at least 6,340 people dead, over 1,000 still missing and $2.86 billion in damage. It is still a reason to read storm advisories closely, even on a calm morning. Wikipedia: Visayas (https://en.wikipedia.org/wiki/Visayas)
