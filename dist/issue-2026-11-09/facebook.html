Customs eyes P2 million guarantee for balikbayan boxes

💵 PISO NGAYON

$500 sent home = about ₱31,508 at the reference rate, before fees.

▪️ BALITA: Customs eyes guarantee for balikbayan boxes
The Bureau of Customs (BOC) wants cargo companies that handle balikbayan boxes to put up money as a guarantee that your box actually reaches home. Under a draft customs order, deconsolidators would have to register with the BOC. These are the firms that receive the containers here and sort the boxes for delivery. They would also open an escrow account, which is money held by a BOC-nominated trust bank as a safety deposit. The deposit would be about P2 million, plus P500,000 for each partner consolidator in each country where they operate. Unregistered operators face a P300,000 fine on the first offense and blacklisting on the second. Forwarders that fail to clear or deliver boxes without a valid reason would be suspended right away. For families who have waited months for a stuck box, this is meant as protection. Still unknown: when the order takes effect, how the deposit would be used for claims, and whether forwarders will pass the cost to senders. This is still a draft, and our only source so far is PhilStar: P2 million escrow, fines eyed over balikbayan boxes (https://www.philstar.com/headlines/2026/11/09/2568855/p2-million-escrow-fines-eyed-over-balikbayan-boxes).
👉 Para sa pamilya: Before your next box, ask your forwarder about its accreditation, and keep the receipt and tracking number until the box is home.

▪️ BALITA: Dollar reserves dip to near four-year low
The country&#39;s dollar reserves fell to $97.4 billion in October, a near four-year low, based on preliminary Bangko Sentral ng Pilipinas (BSP) data. These gross international reserves are the central bank&#39;s holdings of foreign assets, like gold, securities and dollar deposits, used to pay for imports, settle foreign debt and cushion shocks. The total was 2.2 percent lower than September&#39;s $99.49 billion and 11.7 percent below the $110.25 billion of October last year. The BSP pointed to its own dollar operations, which can include selling dollars to calm sharp peso swings, plus lower gold values and government withdrawals for debt payments. The peso hit an intraday record low on Oct. 27. Why it matters: reserves help the BSP steady the peso your padala lands in. The BSP says the buffer is still adequate, covering 6.1 months of imports and service payments. UnionBank economist Ruben Carlo Asuncion said &quot;at $97.4 billion, we are not yet looking at a reserve-adequacy problem.&quot; Unknown: how long the drawdown lasts. PhilStar Business: Dollar reserves slide to $97.4 billion in October (https://www.philstar.com/business/2026/11/09/2568790/dollar-reserves-slide-974-billion-october)
• Inquirer Business also reports the drop: Dollar reserves drop to near 4-year low (https://business.inquirer.net/620082/dollar-reserves-drop-to-near-4-year-low)
👉 Para sa pamilya: No fee changes, but a thinner BSP cushion leaves less room to calm peso swings, so what your padala buys may vary more week to week.

▪️ BALITA: Weak peso costs telcos P17.6 billion
PLDT, Globe and Dito booked a combined P17.6 billion in foreign exchange losses in the first half, based on financial reports. A forex loss here means the weaker peso made their dollar-priced bills, mostly loans and imported equipment, more expensive in pesos. Dito took the biggest hit at P13.88 billion, followed by Globe at P2.36 billion and PLDT at P1.37 billion. Roy Ibay of the Philippine Chamber of Telecommunication Operators said telcos also pay in dollars for the bandwidth behind roaming services many OFWs use, and for subsea cable fees. Why it matters: these costs put pressure on internet prices at home, though the industry notes that raising prices risks losing customers who are also feeling the pinch. For now, mobile data has become cheaper, down to P7.07 per GB from P21.5 per GB in 2023, according to an Ookla study. Still unknown: whether any telco will change load, plan or roaming rates. No price hike is announced in the report. PhilStar Business: Telcos lose P18 billion to peso&#39;s weakness (https://www.philstar.com/business/2026/11/09/2568789/telcos-lose-p18-billion-pesos-weakness)
👉 Para sa pamilya: No telco price change is announced; note what your family&#39;s load, plan and roaming add-ons cost now so any change is easy to spot.

▪️ DISKARTE: BIR may widen tax abatement
Heads-up only, nothing to file yet. The BIR plans to expand its one-time tax abatement program, a way to settle old tax liabilities with penalties reduced or cancelled, to small taxpayers. Business groups PCCI and PhilExport welcomed the plan, saying it would help more businesses resolve unpaid taxes and pending cases. We only have the headline and summary, so the rules, who qualifies and any deadlines are not confirmed. If the family runs a small business with an old BIR issue, wait for the official BIR announcement. Inquirer Business: PCCI, PhilExport back expansion of BIR tax abatement program (https://business.inquirer.net/620038/pcci-philexport-back-expansion-of-bir-tax-abatement-program)
👉 Para sa pamilya: Nothing to pay or file yet; gather any old BIR notices or unpaid tax papers so you are ready once the BIR releases the rules.

▪️ IBA PANG BALITA
• Gov&#39;t workers&#39; bonus: Government employees will get a year-end bonus equal to one month&#39;s salary plus a P5,000 cash gift with their November pay, and the DBM says it released P82.998 billion to cover it. Inquirer: Gov&#39;t workers to get bonus, cash gift (https://newsinfo.inquirer.net/2338120/govt-workers-to-get-bonus-cash-gift)
• Rate cuts later: Nomura raised its 2026 full-year inflation forecast to 5.9 percent and now sees the BSP waiting until the fourth quarter of 2027 to start cutting its policy rate, the benchmark that guides loan interest. Inquirer Business: Higher inflation seen delaying BSP policy rate cuts (https://business.inquirer.net/620075/higher-inflation-seen-delaying-bsp-policy-rate-cuts)
• After Christmas: The Philippine Chamber of Commerce and Industry says holiday spending may give businesses only brief relief before domestic and external pressures return. Inquirer Business: PH firms brace for tougher times after Christmas season (https://business.inquirer.net/620084/ph-firms-brace-for-tougher-times-after-christmas-season)
• Loans slowing: Bankers Association of the Philippines president Ana Aboitiz Delgado expects slower loan growth, as demand is weak and elevated interest rates strain some borrowers. PhilStar Business: Bankers see slower loan growth amid weak demand, borrower stress (https://www.philstar.com/business/2026/11/09/2568786/bankers-see-slower-loan-growth-amid-weak-demand-borrower-stress)
