<textarea id="fbpost" rows="22" style="width:100%;font:15px/1.5 system-ui,sans-serif;padding:10px;border:1px solid #eadfce;border-radius:6px">☀️ Good Morning Manila, 2026-11-10

Big fuel price rollback takes effect today

💵 PISO NGAYON
$1 = ₱63.18 (up ₱0.16 from the previous day; up ₱0.42 in about a month)
$500 sent home = about ₱31,588 at the reference rate, before fees.
(Reference rate, 2026-11-09. Remittance rates and fees differ.)

▪️ BALITA: Big fuel rollback starts today
Pump prices go down starting today, Tuesday, November 10. The Department of Energy (DOE) says gasoline drops by at least P16.80 per liter, diesel by at least P4.10 and kerosene by at least P3.70. A rollback is simply a cut in pump prices, and &quot;at least&quot; means some stations may cut a little more. Energy Secretary Sharon Garin linked the cut to falling world crude prices as tensions between the US and Iran eased after the US midterm elections. For a family with a car, a motorcycle or a relative who drives for a living, this is real money at the pump. What is still unknown is how long the relief lasts. Garin said it could take time before prices return to pre-war levels, and the weak peso keeps pushing fuel costs up because the country imports its oil. Excise taxes on LPG and kerosene stay suspended under Executive Order No. 125, but gasoline and diesel are not covered. PhilStar: Expect P16.80/liter gas price cut today (https://www.philstar.com/headlines/2026/11/10/2569096/expect-p1680liter-gas-price-cut-today)
• Rappler says the new prices apply from November 10 to 16, and notes gasoline had gone up by as much as P3.50 per liter just last week. Before the conflict began on February 28, RON95 gasoline in Metro Manila was commonly at P56 per liter. Rappler: Gasoline, diesel get big rollbacks on November 10 (https://www.rappler.com/business/fuel-prices-adjustments-november-10-2026/)
• Inquirer Business also reports the cut of nearly P17 per liter for gasoline this week. Inquirer Business: Nearly P17/liter gasoline price cut set this week (https://business.inquirer.net/620118/nearly-p17-liter-gasoline-price-cut-set-this-week)
👉 Para sa pamilya: Gasoline is at least P16.80 cheaper per liter from Nov. 10 to 16; check your station&#39;s posted price before filling up.

▪️ BALITA: Economy grows just 2.1% in Q3
The Philippine economy grew only 2.1% from July to September, down from 2.4% the quarter before, the Philippine Statistics Authority reported Monday. GDP, or gross domestic product, is the total value of goods and services the country produces. National Statistician Dennis Mapa said it is the slowest since early 2021, and outside the pandemic, the weakest since late 2009. It is the fifth quarter in a row of slower growth. Household spending, usually the main engine, slowed to 2.4%, farm output shrank 4.8%, and public construction fell 15.1%. Economic Planning Secretary Arsenio Balisacan cited high food and fuel prices, bad weather, weak investment and governance concerns. He said this is not stagflation, meaning weak growth together with high inflation and high unemployment. Still unknown: whether the last quarter bounces back. To reach even the low end of the 3.5% to 4.5% full-year target, Balisacan said growth must hit about 6.3%, which he called &quot;very, very challenging.&quot; PhilStar Business: Economic growth slows to 2.1% in Q3 (https://www.philstar.com/business/2026/11/10/2569030/economic-growth-slows-21-q3)
• Rappler adds that inflation reached 7.8% in October, and Balisacan said he does not expect consumer spending to rebound strongly soon. Rappler: Philippine economic growth slows further to 2.1% in Q3 2026 (https://www.rappler.com/business/gross-domestic-product-philippines-q3-2026/)
• The main stock index, the PSEi, fell after the release. Inquirer Business: PSEi drops to 5,600 level on weak Q3 growth (https://business.inquirer.net/620178/psei-drops-to-5600-level-on-weak-q3-growth); PhilStar Business: Stocks plummet on slower economic growth (https://www.philstar.com/business/2026/11/10/2569027/stocks-plummet-slower-economic-growth)
👉 Para sa pamilya: With growth slow and October inflation at 7.8%, plan the household budget for prices staying high, not easing soon.

▪️ BALITA: Families cutting back on internet plans
Converge ICT Solutions, one of the big home internet providers, says it is getting harder to keep low-income subscribers as prices rise and the peso stays weak. Its cheapest plan, Surf2Sawa, costs P700 for 30 days, and demand for it rises and falls with the economy. Chief operations officer Benjamin Azada pointed to inflation staying above 6% in the third quarter and reaching 7.2% in September. Its pricier FiberX plans, at P1,349 to P2,599 a month, still see steady demand. Converge, now at 3.1 million subscribers, is studying a fiber plan at P500 a month. For OFW families, home internet is often how the video call with Nanay happens, so cutting it means less time together. The International Telecommunication Union counts connectivity as affordable at 2% of average national income per person; Opensignal puts the Philippine cost at 4%. Still unknown: when, or whether, the P500 plan launches. This is one company&#39;s account, in a single report. PhilStar Business: &#39;Low-income Pinoys scrimping on internet usage&#39; (https://www.philstar.com/business/2026/11/10/2569019/low-income-pinoys-scrimping-internet-usage)
👉 Para sa pamilya: If the home internet bill is getting heavy, ask the provider about lower-priced plans before cutting the line used for family calls.

▪️ DISKARTE: Fish prices may rise this season
This is a heads-up, not a deadline. The fishers&#39; group Pamalakaya warns that the yearly three-month closed fishing season, a ban on fishing in several major fishing grounds starting in November, could cause an artificial shortage and push up fish prices at the palengke. We only have the headline and summary, so the exact fishing grounds and dates are not confirmed here, and no government price estimate appears in the coverage. If fish is a regular part of the family&#39;s ulam, it may help to leave some room in the market budget. Inquirer: Closed fishing season may trigger price hike, supply issues – Pamalakaya (https://newsinfo.inquirer.net/2338612/closed-fishing-season-may-trigger-price-hike-supply-issues-pamalakaya)
👉 Para sa pamilya: Fish prices may climb during the three-month fishing ban; leave some room in the palengke budget for ulam.

▪️ SABI NILA
• PhilStar Opinion column: The column argues the proposed new P480-per-passenger immigration fee should be reviewed before it takes effect, citing the PCCI&#39;s call to weigh existing travel charges and fees in ASEAN neighbors. &quot;Even the business sector is worried over the proposed new immigration fee of P480 per passenger.&quot; PhilStar Opinion: Businesses want BI to review immigration fee (https://www.philstar.com/opinion/2026/11/10/2569061/businesses-want-bi-review-immigration-fee)

▪️ IBA PANG BALITA
• Retail profits slip: Home improvement retailer Wilcon Depot&#39;s nine-month net income fell 6% to P1.752 billion, which it blamed on heavy rains and high inflation; SM Prime also reported lower profit as real estate sales slumped. Inquirer Business: Heavy rains, high inflation pull down Wilcon profit (https://business.inquirer.net/620176/heavy-rains-high-inflation-pull-down-wilcon-profit); PhilStar Business: SM Prime profit slips as real estate sales slump (https://www.philstar.com/business/2026/11/10/2569020/sm-prime-profit-slips-real-estate-sales-slump)
• Inflation outlook: Citi expects inflation to stay between 7.5 and 8.1 percent until early 2027, citing food supply risks. Inquirer Business: PH inflation yet to peak, says Citi (https://business.inquirer.net/620143/ph-inflation-yet-to-peak-says-citi)
• Pork import ban: The Department of Agriculture imposed a 60-day ban on pork imports, including fresh and frozen cuts, under Department Order No. 33 to help local hog raisers facing low farm-gate prices; the report says it may be extended. Inquirer Business: DA bans pork imports for 2 months to shield hog raisers (https://business.inquirer.net/620158/da-bans-pork-imports-for-2-months-to-shield-hog-raisers)
• OFWs home safe: The DMW says 61 OFWs affected by unrest in Saudi Arabia arrived at NAIA Terminal 3 on Sunday and received financial assistance, temporary accommodation and transportation. Inquirer Global Nation: 61 OFWs return from Saudi Arabia amid unrest (https://globalnation.inquirer.net/346527/61-ofws-return-from-saudi-arabia-amid-unrest)
