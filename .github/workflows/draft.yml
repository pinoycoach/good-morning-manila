name: Daily draft

on:
  schedule:
    # Backups only: the main start should be an outside timer at 05:00 Manila (GitHub's own timer can run late or skip).
    # 05:20 Manila (UTC+8) Monday to Friday = 21:20 UTC Sunday to Thursday; second backup at 05:45.
    - cron: "20 21 * * 0-4"
    - cron: "45 21 * * 0-4"
  workflow_dispatch:
    inputs:
      force:
        description: "Draft again even if today's draft exists (moves the old one aside; costs one Claude call)"
        type: boolean
        default: false
      dry_run:
        description: "Test run: no Claude call, placeholder text"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Manila
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # A separate Telegram group for this publication, so its ping never mixes with Diskarte Daily's.
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRAFT_TOKEN: ${{ secrets.DRAFT_TOKEN }}
      NEWSLETTER_EDITOR: ${{ vars.NEWSLETTER_EDITOR || 'Napoleon Beltran' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://diskartedaily.com' }}
      PAGE_NAME: ${{ vars.PAGE_NAME || 'Digitally Manila' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Fonts for the cover card
        run: sudo apt-get install -y -q fonts-liberation
      - run: npm ci
      - name: Draft today's brief
        id: draft
        run: npm run draft -- --no-ping ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save the draft in this repo
        run: |
          git config user.name "gmm-bot"
          git config user.email "bot@diskartedaily.com"
          git add dist
          git commit -m "draft: $(date +%F)" || echo "nothing to commit"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::Could not save the draft after 3 tries."; exit 1
      # The private preview lives on diskartedaily.com/drafts/<token>/gmm-<date>/, served by the Diskarte Daily site.
      # Needs DISKARTE_PUSH_TOKEN (Contents read/write on pinoycoach/diskarte-daily only). actions/checkout keeps
      # the token out of the clone URL and the logs.
      - name: Check out the Diskarte site (for the preview)
        if: ${{ steps.draft.outputs.drafted == 'true' && env.DRAFT_TOKEN != '' }}
        uses: actions/checkout@v5
        with:
          repository: pinoycoach/diskarte-daily
          token: ${{ secrets.DISKARTE_PUSH_TOKEN }}
          path: site-repo
          fetch-depth: 1
      - name: Put the preview online
        if: ${{ steps.draft.outputs.drafted == 'true' && env.DRAFT_TOKEN != '' }}
        run: |
          DAY=$(date +%F)
          DEST="site-repo/dist/site/drafts/$DRAFT_TOKEN/gmm-$DAY"
          rm -rf "$DEST" && mkdir -p "$DEST"
          for f in index.html facebook.html review.md og; do
            [ -e "dist/issue-$DAY/$f" ] && cp -r "dist/issue-$DAY/$f" "$DEST/"
          done
          cd site-repo
          git config user.name "gmm-bot"
          git config user.email "bot@diskartedaily.com"
          git add dist/site/drafts
          git commit -m "gmm preview: $DAY" || { echo "preview unchanged"; exit 0; }
          # Diskarte's own draft may push in the same minute: replay on top and retry; fail loudly if it never lands.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::Could not put the preview online after 5 tries."; exit 1
      - name: Wait for the site to publish the preview
        if: ${{ steps.draft.outputs.drafted == 'true' && env.DRAFT_TOKEN != '' }}
        run: sleep 60
      - name: Telegram ping
        if: ${{ steps.draft.outputs.drafted == 'true' }}
        run: npm run ping
      - name: Tell the owner if the preview or save failed
        if: ${{ failure() && steps.draft.outcome == 'success' }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠ Good Morning Manila for $(date +%F) was written, but saving it or putting the preview online failed, so the links may not open. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
